name: test

on: [push, workflow_call]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # httpx2 requires python>=3.11
      - run: uvx --with tox-uv tox ${{ matrix.python-version == '3.10' && '--skip-env ".*httpx2"' || '' }}
