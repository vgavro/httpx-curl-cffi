[tox]
requires = tox>=4
# NOTE: deps factor conditions match env names split by "-" as a whole,
# so names are without dots (a `0.7:` condition never matched `dep0.7`)
envlist = cffi{07,015,016,017}

[testenv]
dependency_groups =
    test
deps =
    pytest
    cffi07: curl-cffi>=0.7,<0.8
    cffi015: curl-cffi>=0.15,<0.16
    cffi016: curl-cffi>=0.16,<0.17
    cffi017: curl-cffi>=0.17,<0.18
commands =
    python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"
    pytest {posargs}
