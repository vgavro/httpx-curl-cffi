[tox]
requires = tox>=4
# NOTE: deps factor conditions match env names split by "-" as a whole,
# so names are without dots (a `0.7:` condition never matched `dep0.7`)
# httpx replacements are tested with the latest curl-cffi only,
# httpx2 requires python>=3.11 (skip with `--skip-env .*httpx2`)
envlist = cffi{07,015,016,017}, cffi017-{httpxyz,httpx2,httpx2-alias}

[testenv]
dependency_groups =
    test
deps =
    pytest
    cffi07: curl-cffi>=0.7,<0.8
    cffi015: curl-cffi>=0.15,<0.16
    cffi016: curl-cffi>=0.16,<0.17
    cffi017: curl-cffi>=0.17,<0.18
    # registers itself as `httpx` by autoloaded pytest plugin
    httpxyz: httpxyz>=0.31.2
    httpx2: httpx2[brotli,zstd]>=2.16.2
# httpx module tested, see tests/conftest.py
setenv =
    httpx2: TEST_HTTPX = httpx2
    alias: TEST_HTTPX_ALIAS = 1
commands =
    python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"
    pytest {posargs}
